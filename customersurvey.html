    <h2> Customer Survey </h2>
    
<form> 
  <h2> Create an Account with us! </h2>
  <label for ="fname">First Name</label>
<input type ="text" placeholder = "First Name" name="fname"> 
  <label for ="lname">Last Name</label>
<input type ="text" placeholder = "Last Name" name="lname">
  <label for ="uemail">Email</label>
<input type ="email" placeholder = "Email" name = "uemail">
  <label for ="password"> Password</label>
<input type ="password" placeholder = "password" name="password">

  <h2> Additional info </h2>
<label for ="town"> Town </label>
  <input type="text" placeholder="town" name = "town">

<label for = "favbagel" > Favorite Bagel </label>
  <input list = "Favorite Bagel" id = "favbagel">
  <datalist id = "Favorite Bagel">
    <option value = "Plain Bagel">
    <option value = "Cinnamon Raisin Bagel">
    <option value = "Everything Bagel">
    <option value = "Egg Bagel">
    <option value = "French toast Bagel">
      
  </datalist>
      
<button type = "submit"> Submit </button>






</form>
